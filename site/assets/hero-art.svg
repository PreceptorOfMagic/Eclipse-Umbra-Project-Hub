<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Eclipse and Umbra support regular streaming and two-PC couch co-op</title>
  <desc id="desc">The upper path shows one Umbra gaming PC streaming through Eclipse to a full television screen. The lower path shows two Umbra PCs streaming through Eclipse to a split television screen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#171020"/><stop offset=".5" stop-color="#08070b"/><stop offset="1" stop-color="#130d1e"/></linearGradient>
    <linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#2e1065"/></linearGradient>
    <linearGradient id="b" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#3b0764"/><stop offset="1" stop-color="#d8b4fe"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="32"/></filter>
  </defs>
  <rect width="1440" height="900" rx="42" fill="url(#bg)"/>
  <circle cx="822" cy="450" r="210" fill="#7c3aed" opacity=".12" filter="url(#glow)"/>
  <path d="M70 450H1370" stroke="#d8b4fe" stroke-opacity=".13"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <text x="72" y="76" fill="#a78bfa" font-size="20" font-weight="800" letter-spacing="3">EVERYDAY STREAMING</text>
    <text x="72" y="505" fill="#a78bfa" font-size="20" font-weight="800" letter-spacing="3">TWO-HOST CO-OP</text>
  </g>
  <g transform="translate(74 135)">
    <g><rect width="220" height="150" rx="18" fill="#14111a" stroke="#655a72" stroke-width="3"/><rect x="18" y="30" width="184" height="96" rx="9" fill="url(#a)"/><circle cx="27" cy="17" r="4" fill="#d8b4fe"/><path d="M62 143h96" stroke="#655a72" stroke-width="7"/><text x="110" y="178" fill="#f5f3ff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="800" text-anchor="middle">UMBRA HOST</text></g>
    <path d="M248 76H452" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/><path d="m441 65 14 11-14 11" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(474 32)"><rect width="162" height="88" rx="22" fill="#1a1424" stroke="#a78bfa" stroke-width="3"/><text x="81" y="42" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="900" text-anchor="middle">ECLIPSE</text><text x="81" y="65" fill="#bdb4c8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" text-anchor="middle">CLIENT</text></g>
    <path d="M660 76H830" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/><path d="m819 65 14 11-14 11" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(854 -35)"><rect width="430" height="244" rx="23" fill="#050507" stroke="#80758f" stroke-width="5"/><rect x="18" y="18" width="394" height="208" rx="10" fill="url(#a)"/><g fill="none" stroke="#fff" stroke-opacity=".42"><circle cx="215" cy="120" r="62" stroke-width="3"/><path d="m177 142 38-62 38 62Z" stroke-width="5"/></g><path d="M185 244h60l13 39h-86l13-39Z" fill="#302a39"/><path d="M142 283h146" stroke="#80758f" stroke-width="12" stroke-linecap="round"/></g>
  </g>
  <g transform="translate(74 596)">
