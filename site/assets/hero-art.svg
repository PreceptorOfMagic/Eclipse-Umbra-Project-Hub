    <g transform="translate(0 127)"><rect width="190" height="126" rx="16" fill="#14111a" stroke="#655a72" stroke-width="3"/><rect x="16" y="27" width="158" height="78" rx="8" fill="url(#b)"/><text x="95" y="151" fill="#f5f3ff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="800" text-anchor="middle">UMBRA B</text></g>
