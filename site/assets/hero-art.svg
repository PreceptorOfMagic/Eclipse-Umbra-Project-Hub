    <path d="M660 76H830" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/><path d="m819 65 14 11-14 11" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(854 -35)"><rect width="430" height="244" rx="23" fill="#050507" stroke="#80758f" stroke-width="5"/><clipPath id="screen"><rect x="18" y="18" width="394" height="208" rx="10"/></clipPath><g clip-path="url(#screen)"><rect x="18" y="18" width="197" height="208" fill="url(#a)"/><rect x="215" y="18" width="197" height="208" fill="url(#b)"/><path d="M215 18v208" stroke="#fff" stroke-width="3"/><g fill="none" stroke="#fff" stroke-opacity=".42"><circle cx="117" cy="120" r="52" stroke-width="3"/><path d="m87 140 30-51 30 51Z" stroke-width="5"/><rect x="264" y="72" width="98" height="98" rx="20" stroke-width="4"/><path d="m288 121 22 22 33-45" stroke-width="6"/></g></g><path d="M185 244h60l13 39h-86l13-39Z" fill="#302a39"/><path d="M142 283h146" stroke="#80758f" stroke-width="12" stroke-linecap="round"/></g>
  </g>
